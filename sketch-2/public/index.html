<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#13101b" />
  <title>Sidequest — Sketch 2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2313101b'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23a97af2'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="shell">
    <!-- Desktop only: demo controls next to the phone. Hidden on a real phone. -->
    <aside class="side" aria-label="Sketch controls">
      <div class="brand" id="side-brand"></div>
      <p>Sketch 2 · the Figma redesign, built on Sketch 1's server, database and AI.</p>
      <span class="ai-pill" id="ai-pill"><i></i><span>Connecting…</span></span>

      <h2>View the app as</h2>
      <div class="seg" id="side-role">
        <button type="button" data-role="attendee">Attendee</button>
        <button type="button" data-role="host">Host</button>
      </div>

      <h2>Jump to a screen</h2>
      <select id="side-jump" aria-label="Jump to a screen"></select>

      <div class="demo-code" id="side-code" hidden></div>

      <button type="button" class="reset" id="side-reset">Reset all data</button>
    </aside>

    <div class="device">
      <div class="phone" id="phone">
        <div id="screen" tabindex="-1"></div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <!-- Plain scripts, no build step -->
  <script src="./js/ui.js"></script>
  <script src="./js/sites.js"></script>
  <script src="./js/screens-attendee.js"></script>
  <script src="./js/screens-host.js"></script>
  <script src="./js/actions.js"></script>
  <script src="./js/wallet.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
