name: Deploy to GitHub Pages

on:
  push:
    branches: "main"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Pages can't run server.js, so it's bundled to run in the browser (see sketch-1/web/boot.js)
      - name: Build
        run: sh web/build.sh
        working-directory: ./sketch-1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './sketch-1/dist' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
