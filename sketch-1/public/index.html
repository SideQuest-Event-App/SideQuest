<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#121212" />
  <title>Sidequest — Sketch 1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230b0a10'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23d4ff3a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <!-- Desktop only: demo controls next to the phone. Hidden on a real phone. -->
    <aside class="side" aria-label="Sketch controls">
      <div class="brand">Side<span>quest</span></div>
      <p>Sketch 1 · the proposal's attendee and host apps at higher fidelity, on a real server, database and AI.</p>
      <span class="ai-pill" id="ai-pill"><i></i><span>Connecting…</span></span>

      <h2>View the app as</h2>
      <div class="seg" id="side-role">
        <button type="button" data-role="attendee">Attendee</button>
        <button type="button" data-role="host">Host</button>
      </div>

      <h2>Jump to a screen</h2>
      <select id="side-jump" aria-label="Jump to a screen"></select>

      <h2>Appearance</h2>
      <div class="seg three" id="side-theme">
        <button type="button" data-theme-pick="dark">Dark</button>
        <button type="button" data-theme-pick="light">Light</button>
        <button type="button" data-theme-pick="system">System</button>
      </div>

      <button type="button" class="reset" id="side-reset">Reset all data</button>
    </aside>

    <div class="device">
      <div class="phone" id="phone">
        <div class="statusbar" aria-hidden="true">
          <span id="clock">9:41</span>
          <span class="notch"></span>
          <span class="icons">
            <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg viewBox="0 0 26 12"><rect x="0.5" y="0.5" width="22" height="11" rx="3" fill="none" stroke="currentColor" opacity=".5"/><rect x="2.5" y="2.5" width="16" height="7" rx="1.5"/><rect x="24" y="4" width="1.6" height="4" rx=".8" opacity=".5"/></svg>
          </span>
        </div>
        <div id="screen" tabindex="-1"></div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <!-- Plain scripts, no build step -->
  <script src="js/ui.js"></script>
  <script src="js/screens-attendee.js"></script>
  <script src="js/screens-host.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
